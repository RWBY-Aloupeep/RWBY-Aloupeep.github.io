# Site settings. Jekyll does not reload this file while `jekyll serve` is
# running; restart the server after editing it.

title       : "Diwen (Steven) Xu"
description : "Computational mathematics student at the University of Washington, working on physics-based and differentiable simulation."
tagline     : "Computational Mathematics · Physics-Based Simulation"
url         : "https://rwby-aloupeep.github.io"
baseurl     : ""
lang        : "en"
timezone    : "America/Los_Angeles"

# Opt out of the default GitHub Pages theme; this site ships its own layouts.
theme: null

# Who the site is about. Used in the header, home page, contact page,
# footer, and search/social metadata.
author:
  name        : "Diwen (Steven) Xu"
  short_name  : "Steven"
  native_name : "许迪文"
  email       : "rwbyaloupeep@gmail.com"
  github      : "RWBY-Aloupeep"
  linkedin    : "diwen-xu"
  motto:
    - "Enjoy the suffering."
    - "Actions shape the mind."
    - "The mind shapes fate."

twitter:
  card: summary_large_image

# Profile links for search engines. Keep them in step with `author` above.
social:
  name: "Diwen (Steven) Xu"
  links:
    - "https://github.com/RWBY-Aloupeep"
    - "https://www.linkedin.com/in/diwen-xu"

# Build
markdown    : kramdown
highlighter : rouge
kramdown:
  input       : GFM
  auto_ids    : true
  smart_quotes: lsquo,rsquo,ldquo,rdquo

sass:
  sass_dir: _sass
  style   : compressed

include:
  - _pages

# The chapters of the home page, one file each in _chapters/. They have no
# pages of their own: the home layout shows them all, one after another.
collections:
  chapters:
    output: false

exclude:
  - .devcontainer
  - Dockerfile
  - docker-compose.yaml
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor

defaults:
  - scope:
      path: ""
    values:
      image: /images/og.jpg # link preview (Open Graph / Twitter card)
  - scope:
      path: ""
      type: pages
    values:
      layout: page

plugins:
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-sitemap
