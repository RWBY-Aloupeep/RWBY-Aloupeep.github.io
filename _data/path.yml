# The Experience chapter: one timeline, newest first.
#
# Each top-level entry is a place I belonged to: a school now, a company later.
# It sits flush with the timeline. `items` are what I did while I was there
# (research, projects, short programs), newest first, indented under it.
#
# Fields:
#   year    shown in the left margin
#   org     the place (top-level entries) or title (items); Markdown links work
#   title   the degree or role
#   where   for items: where it happened, who supervised it
#   note    a few words, in italics after the title
#   honors  top-level only: a list of `title` + `year`, shown on one line
#   why     the motivation: a few keywords, as a list ([curiosity, craft]) or
#           as one short phrase. Leave it out when there is none.
#
# `&nbsp;` keeps a name on one line; links open in a new tab.

