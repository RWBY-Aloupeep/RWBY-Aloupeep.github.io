# The site is told as a story. Chapters are listed in reading order: they make
# up the header menu, the chapter cards on the home page, and the
# previous/next links at the bottom of each chapter.
#
# Numbered chapters have a `numeral` and are labelled "Chapter I", "Chapter II"…
# Unnumbered ones (a prologue, an epilogue, an interlude) have a `label`
# instead, shown in place of both.
#
# `nav` is the shorter label used in the header menu (defaults to `title`).
# `preview` names the file in _includes/previews/ that fills the chapter's card
# on the home page; without one the card shows `summary`.
chapters:
  - numeral: "I"
    title: "Study"
    url: /study/
    summary: "Education, honors, and lecture notes."
    preview: study

  - numeral: "II"
    title: "Research"
    url: /research/
    summary: "High-fidelity, differentiable multi-physics simulation, toward the next generation of physics engines."
    preview: research

  - numeral: "III"
    title: "Life"
    url: /life/
    summary: "Philosophy, music, anime, games, and swimming."
    preview: life

  - label: "Epilogue"
    title: "Acknowledgments"
    nav: "Acks"
    url: /acks/
    summary: "To the people who shaped who I am."

# Extra header links shown after the chapters.
links:
  - title: "Contact"
    url: /contact/
