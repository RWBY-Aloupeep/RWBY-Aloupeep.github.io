<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  // Pick the theme before first paint so the page never flashes the wrong colors.
  // Dark unless the visitor switched to light; site.js handles the toggle.
  (function () {
    var root = document.documentElement;
    var stored = null;
    try { stored = localStorage.getItem("theme"); } catch (e) {}
    root.setAttribute("data-theme", stored === "light" ? "light" : "dark");
    root.className = root.className.replace(/\bno-js\b/, "js");
  })();
</script>
