{%- comment -%}
  The colophon, as at the end of a book. Contact links live in the prologue.
{%- endcomment -%}
<footer class="site-footer">
  <div class="site-footer__inner wrap wrap--wide" data-stars-avoid>
    <p class="site-footer__colophon">
      <span>&copy; {{ site.time | date: "%Y" }} {{ site.author.name }}</span>
      <span>Updated {{ site.time | date: "%B %Y" }}</span>
    </p>
    <a class="site-footer__top" href="#">Back to top&nbsp;&uarr;</a>
  </div>
</footer>
